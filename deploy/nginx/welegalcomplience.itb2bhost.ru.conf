# /etc/nginx/sites-available/welegalcomplience.itb2bhost.ru
# После копирования: certbot --nginx -d welegalcomplience.itb2bhost.ru (добавит блок 443 и редирект)

limit_req_zone $binary_remote_addr zone=wlc_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name welegalcomplience.itb2bhost.ru;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=wlc_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
